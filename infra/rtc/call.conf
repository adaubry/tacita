# — Element Call de la pile **avec** overlay RTC.
#
# Un bloc `server` à part, et non une `location` sous le domaine principal : l'image
# d'Element Call sert son SPA à la racine de son origine et référence ses assets en
# chemins absolus (`/assets/...`, voir `config/nginx.conf` de la v0.23.0). Sous un
# préfixe, l'index se charge et tous les assets partent en 404.
#
# `server_name` en **expression régulière** : le bloc de base est `server_name _`,
# c'est-à-dire le défaut. nginx essaie les noms exacts, puis les regex, puis le défaut —
# `call.<domaine>` arrive donc ici, tout le reste continue vers le bloc principal. Pas
# d'envsubst, donc pas de nom de domaine templaté à tenir à jour.
#
# ⚠️ Le certificat monté depuis `proxy/certs` doit porter un SAN pour ce nom, au même
# titre que `TURN_DOMAIN` (voir README.md). Sans lui, l'iframe d'appel échoue au TLS et
# le shard affiche son délai de chargement sans pouvoir en dire la cause.
server {
    listen 443 ssl;
    http2 on;
    # La capture nommée donne le nom du homeserver : `call.chat.example.org` →
    # `chat.example.org`. C'est elle qui permet de servir la configuration ci-dessous
    # sans rien templater au démarrage — voir le bloc `/config.json`.
    server_name ~^call\.(?<homeserver>.+)$;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # — Configuration d'Element Call, servie par nous et non par lui.
    #
    # **L'image ne peut pas écrire dans son propre `/app`** : elle tourne en uid 101 et
    # le répertoire appartient à root. L'overlay y rendait pourtant un `config.json` par
    # un `sed` au démarrage — le conteneur sortait donc en « Permission denied » avant
    # d'avoir lancé nginx, et repartait toutes les 60 secondes (le plafond du backoff de
    # Docker). Constaté le 26/08/2026 sur un vrai déploiement, jamais avant : l'overlay
    # RTC exigeait deux IPv4 publiques, donc cet entrypoint n'avait littéralement jamais
    # tourné. Règle 4 — « module terminé » et « produit qui marche » sont deux portes.
    #
    # Servir la configuration ici retire le problème plutôt que de le contourner : le
    # conteneur reste celui d'amont, sans entrypoint à nous, sans volume, sans root. Et
    # c'est déjà le patron de `well-known.conf`, pour la même raison — une valeur qui
    # dépend du domaine se prend au domaine de la requête.
    #
    # Element Call va bien la chercher en HTTP à la racine de son origine : l'image
    # n'embarque aucun `config.json` (relu dans la v0.23.0, `/app` ne contient que
    # `index.html`, `favicon.png` et `assets/`).
    #
    # ⚠️ `matrix_rtc_mode` est **épinglé**, et pas laissé au défaut : sans lui, c'est le
    # réglage développeur de chaque utilisateur qui décide (défaut `legacy`), donc une
    # valeur différente par appareil. Les trois modes de `MatrixRTCMode` (v0.23.0) :
    # `legacy` (SFU unique, endpoint JWT historique), `compatibility` (transport
    # multi-SFU, endpoint JWT historique, **pas d'événements sticky**), `matrix_2_0`
    # (événements sticky, identité hachée, nouvel endpoint JWT). On prend
    # `compatibility` — celui du sample amont — pour deux raisons vérifiables : il garde
    # l'endpoint JWT que sert `lk-jwt-service` dans cet overlay, et il n'active **pas**
    # les événements sticky. C'est ce second point qui compte : `matrix_2_0` est
    # exactement la divergence MSC4354 que `packages/calls/README.md` signale, et sous
    # laquelle `activeCall()` cesserait de voir les participants sans erreur bruyante.
    # À relire au prochain bump d'image.
    #
    # Aucun secret ici : ces valeurs sont publiques dès le premier appel réseau du client.
    location = /config.json {
        default_type application/json;
        return 200 '{"default_server_config":{"m.homeserver":{"base_url":"https://$homeserver","server_name":"$homeserver"}},"livekit":{"livekit_service_url":"https://$homeserver/livekit/jwt"},"matrix_rtc_mode":"compatibility"}';
    }

    location / {
        set $element_call_upstream element-call:8080;
        proxy_pass http://$element_call_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
