# Chemin RTC — `infra/rtc`. Overlay du compose de `infra` (même projet, même
# réseau, donc les noms d'hôte attendus par le proxy résolvent) :
#
#   docker compose -f docker-compose.yml -f rtc/docker-compose.yml up -d
#
name: tacita

services:
  livekit-sfu:
    image: livekit/livekit-server@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1 # v1.13.5
    restart: unless-stopped
    # ponytail: une seule valeur est templatée et l'image n'a pas envsubst — un
    # sed au démarrage évite un Dockerfile + entrypoint pour ça.
    entrypoint:
      - /bin/sh
      - -c
      - sed "s|__TURN_DOMAIN__|$$TURN_DOMAIN|" /conf/livekit.yaml > /tmp/livekit.yaml
        && exec /livekit-server --config /tmp/livekit.yaml
    environment:
      # le TURN s'annonce sous le nom du homeserver, pas sous un sous-domaine à lui :
      # le certificat le porte forcément, et c'est un enregistrement DNS de moins à
      # créer. Il n'y a plus de `TURN_DOMAIN` dans `.env`, et c'est voulu.
      TURN_DOMAIN: ${SERVER_NAME}
      LIVEKIT_KEYS: "${LIVEKIT_KEY}: ${LIVEKIT_SECRET}"
    ports:
      # miroir strict de rtc/firewall/ ; ouvrir ici sans ouvrir là
      # (ou l'inverse) donne un appel qui se connecte puis coupe à 15-20 s.
      - "50000-50100:50000-50100/udp"
      - "7881:7881/tcp"
      - "3478:3478/udp"
      # TURN-TLS sur 5349, l'IP par défaut de l'hôte suffit : le proxy garde le 443
      # pour lui seul. C'est ce qui permet à un hôte à une seule IPv4 — le cas de
      # l'auto-hébergement — de servir les appels. Motif complet dans livekit.yaml.
      - "5349:5349/tcp"
    # **Les chemins sont relatifs à `infra/`, pas à ce fichier.** Compose résout les
    # chemins de *tous* les `-f` contre le répertoire de projet, qui est celui du
    # **premier** — donc `infra/`. Un `./livekit.yaml` d'apparence évidente désignait
    # `infra/livekit.yaml`, absent : Docker crée alors un **répertoire** à ce nom et le
    # monte, et le service lit un répertoire là où il attend un fichier.
    volumes:
      - ./rtc/livekit.yaml:/conf/livekit.yaml:ro
      # même certificat que le proxy : le TURN et le homeserver partagent le domaine
      - ./proxy/certs:/certs:ro

  # Traduit une identité Matrix en jeton d'accès LiveKit. Le SFU ne fait confiance
  # qu'aux jetons qu'il signe : c'est ici que se joue l'autorisation.
  lk-jwt-service:
    image: ghcr.io/element-hq/lk-jwt-service@sha256:d210fd778ba38b7e42e6fc64e8a24a7d66ccc3b938fb20d73bd713224af2dfea # v0.9.0, résolu le 2026-10-31
    restart: unless-stopped
    environment:
      LIVEKIT_URL: wss://${SERVER_NAME}/livekit/sfu
      LIVEKIT_KEY: ${LIVEKIT_KEY}
      LIVEKIT_SECRET: ${LIVEKIT_SECRET}
      # restreint au domaine du déploiement. `*` laisserait n'importe
      # quel homeserver déclencher la création de salles sur notre SFU.
      #
      # **Et c'est aussi ce qui allume le contrôle d'appartenance** : v0.9.0 ne vérifie
      # `is_joined` sur `/sfu/get` et `/get_token` que si cette liste est exactement
      # `LIVEKIT_HS_SERVER_NAME`. Y ajouter un second serveur l'éteindrait en silence.
      LIVEKIT_FULL_ACCESS_HOMESERVERS: ${SERVER_NAME}
      # Application service (voir `lk-jwt-appservice.yaml.tmpl`) : les mêmes jetons que
      # l'enregistrement que Synapse lit, et le serveur à interroger.
      LIVEKIT_HS_SERVER_NAME: ${SERVER_NAME}
      LIVEKIT_AS_TOKEN: ${LIVEKIT_AS_TOKEN}
      LIVEKIT_HS_TOKEN: ${LIVEKIT_HS_TOKEN}
      # Synapse par le réseau du compose, pas par l'IP publique et le proxy : le jeton
      # d'application service ne sort pas de l'hôte.
      LIVEKIT_CS_API_URL_OVERRIDES: ${SERVER_NAME}=http://synapse:8008

  # Ce que les appels ajoutent à Synapse : l'enregistrement de `lk-jwt-service`, rendu au
  # démarrage par `synapse/entrypoint.sh`. Fusionné avec le service de la pile de base.
  synapse:
    environment:
      LIVEKIT_AS_TOKEN: ${LIVEKIT_AS_TOKEN}
      LIVEKIT_HS_TOKEN: ${LIVEKIT_HS_TOKEN}
      SYNAPSE_APP_SERVICE_FILES: '["/data/appservice/lk-jwt-appservice.yaml"]'
    volumes:
      # chemin relatif à `infra/`, comme partout dans cet overlay (voir `livekit-sfu`)
      - ./rtc/lk-jwt-appservice.yaml.tmpl:/conf/appservice/lk-jwt-appservice.yaml.tmpl:ro

  # Element Call, le seul client RTC autorisé (interdit n°7), servi par
  # nous. Épinglé par digest comme tout le compose : c'est lui qui rend vraies les
  # valeurs que `packages/calls` écrit dans l'URL du widget — un paramètre relu dans
  # une version, puis servi par une autre, est une jonction non relue.
  element-call:
    image: ghcr.io/element-hq/element-call@sha256:e352de468647777e3780fec45281e2ccc90da69a828f7a3d88700ff9ac04bb0b # v0.23.0, résolu le 2026-08-07
    restart: unless-stopped
    # **Aucun entrypoint, aucun volume, aucune variable** : le conteneur est celui
    # d'amont, tel quel. Sa configuration est servie par le proxy (`rtc/call.conf`,
    # `location = /config.json`), parce que l'image tourne en uid 101 et que son `/app`
    # appartient à root — le `sed` au démarrage qui vivait ici ne pouvait pas écrire, et
    # le conteneur repartait toutes les 60 secondes sans jamais servir une page.

  proxy:
    # aucun `ports:` ici, et c'est le fait marquant de cet overlay : le proxy garde
    # ceux de la pile de base. Le TURN a quitté le 443 pour le 5349, donc plus rien ne
    # se dispute le port, et déployer les appels ne demande plus une seconde IPv4.
    #
    # l'annonce du focus appartient à cet overlay, pas à la pile de base :
    # elle n'est vraie que là où les backends `/livekit/*` existent. Même cible de
    # montage que `proxy/well-known.conf`, que compose remplace au lieu de l'ajouter.
    #
    # même mécanique pour le service d'Element Call : la pile de base
    # monte un fichier vide, l'overlay monte le bloc `server` qui le sert.
    #
    # Chemins relatifs à `infra/` — voir `livekit-sfu` : c'est le répertoire du premier
    # `-f` qui fait foi, jamais celui du fichier qui les écrit.
    volumes:
      - ./rtc/well-known.conf:/etc/nginx/well-known.conf:ro
      - ./rtc/call.conf:/etc/nginx/call.conf:ro
