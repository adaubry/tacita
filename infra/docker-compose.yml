name: tacita

services:
  postgres:
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20 # postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      # Synapse refuse de démarrer sans locale C.
      POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # crée la base dédiée du service de liens à la première
      # initialisation du volume. Sur une pile existante, voir le script.
      - ./postgres/10-invite-tokens.sh:/docker-entrypoint-initdb.d/10-invite-tokens.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # stockage objet des médias — blobs déjà chiffrés côté client, le bucket n'y voit rien.
  #
  # `--single-node --default-bucket` amorce tout au premier démarrage depuis le .env :
  # layout mono-nœud, clé S3 importée telle quelle (identifiant et secret), bucket créé et
  # autorisé. Les démarrages suivants ne refont rien. Un S3_SECRET_ACCESS_KEY qui aurait
  # changé fait refuser le démarrage en nommant la cause — le conteneur boucle, Synapse qui
  # l'attend ne part jamais, et `pnpm admin doctor` le dit.
  garage:
    image: dxflrs/garage@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5 # v2.5.0
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      # L'image n'a pas de shell : la CLI en exec direct. Vert = le RPC répond ET le bucket
      # de l'amorçage existe, donc Synapse peut écrire dès que la condition est remplie.
      test: ["CMD", "/garage", "bucket", "info", "${S3_BUCKET}"]
      interval: 5s
      timeout: 5s
      retries: 10

  synapse:
    build: ./synapse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SYNAPSE_REGISTRATION_SHARED_SECRET: ${SYNAPSE_REGISTRATION_SHARED_SECRET}
      SYNAPSE_MACAROON_SECRET_KEY: ${SYNAPSE_MACAROON_SECRET_KEY}
      SYNAPSE_FORM_SECRET: ${SYNAPSE_FORM_SECRET}
      SYNAPSE_IP_RANGE_WHITELIST: ${SYNAPSE_IP_RANGE_WHITELIST:-[]}
      # Aucun application service sans overlay : voir `app_service_config_files`.
      SYNAPSE_APP_SERVICE_FILES: "[]"
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./synapse/homeserver.yaml.tmpl:/conf/homeserver.yaml.tmpl:ro
      # D-12 — modules Synapse. Montés dans un répertoire du `PYTHONPATH` de l'image
      # (cf. `synapse/Dockerfile`), sinon `modules:` lève « ModuleNotFoundError » au
      # démarrage et le homeserver ne boote pas du tout.
      - ./synapse/modules:/conf/modules:ro
      - synapse-data:/data

  # `push-gateway` livre le service le provisionne : sans ça, la
  # passerelle est terminée et injoignable. Synapse la contacte par son nom sur le
  # réseau du compose ; l'URL à enregistrer côté client est dans README.md.
  #
  # Aucun `ports:` volontairement. `/_matrix/push/v1/notify` n'a pas d'authentification
  # (`push-gateway` : la subscription complète arrive dans le payload de Synapse) — publié sur
  # l'hôte, il ferait de la passerelle un relais de push ouvert. Seule la clé publique
  # VAPID sort, par le proxy.
  push-gateway:
    build:
      context: ..
      dockerfile: apps/push-gateway/Dockerfile
    restart: unless-stopped
    environment:
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}

  # le service de liens d'invitation. Même jurisprudence que la
  # passerelle push : `invite-tokens` livre le code le provisionne.
  #
  # **Aucun secret d'administration Synapse ici**, et un test l'asserte : le service ne
  # détient aucun pouvoir Matrix. Il valide le jeton de son appelant auprès de Synapse et
  # rend un identifiant ; c'est le client qui invite.
  #
  # Base dédiée `invite_tokens`, jamais celle de Synapse. Joint par son nom sur le réseau
  # du compose ; seul le proxy l'expose, sous /invite/.
  invite-tokens:
    build:
      context: ..
      dockerfile: apps/invite-tokens/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/invite_tokens
      # Synapse par son nom sur le réseau du compose, pas par le proxy TLS : passer par
      # `https://${SERVER_NAME}` rejouerait les quatre causes du 503 OIDC (résolution du
      # nom depuis le réseau Docker, CA de développement, protection SSRF). Ces appels
      # sont internes, ils n'ont rien à gagner à ressortir.
      HOMESERVER_URL: http://synapse:8008

  # seul point d'entrée TLS ; routes /_matrix, /livekit/jwt, /livekit/sfu
  # (backends /livekit/* provisionnés par `infra/rtc`, absents tant qu'elle n'est pas déployée).
  proxy:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 # nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - synapse
      - push-gateway
    ports:
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      # pile sans SFU : le `.well-known` n'annonce aucun focus. L'overlay
      # RTC monte son propre fichier à ce chemin, compose fusionne par cible de montage.
      - ./proxy/well-known.conf:/etc/nginx/well-known.conf:ro
      # même mécanique : pile sans SFU, aucun Element Call servi. Le
      # fichier est vide de directives ; l'overlay RTC monte le bloc `server` à sa place.
      - ./proxy/call.conf:/etc/nginx/call.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro

volumes:
  postgres-data:
  garage-data:
  synapse-data:
