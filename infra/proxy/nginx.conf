worker_processes auto;
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s; # DNS embarqué Docker — services `infra/rtc` pas encore levés
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        client_max_body_size 200M; # aligné sur max_upload_size

        # **un 413 doit rester lisible par le navigateur.** Mesuré le
        # 20/08/2026 : un téléversement au-dessus du plafond était rejeté ici, donc
        # avant Synapse — et une réponse d'erreur produite par nginx ne porte aucun
        # en-tête CORS. Le navigateur masque alors le statut au JavaScript et ne rend
        # qu'un « CORS Missing Allow Origin », sans code. Le client ne pouvait donc pas
        # classer l'erreur : sans statut HTTP, elle passait pour une panne réseau, et la
        # file d'envoi réessayait en boucle une requête qui ne pouvait jamais aboutir.
        #
        # Le bloc nommé ne se déclenche **que** sur 413 : les réponses normales gardent
        # l'en-tête que Synapse pose lui-même, et un `add_header` inconditionnel en
        # produirait deux, ce que les navigateurs refusent.
        error_page 413 @televersement_trop_gros;
        location @televersement_trop_gros {
            add_header Access-Control-Allow-Origin  * always;
            add_header Access-Control-Allow-Headers * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            default_type application/json;
            # Le corps est une erreur Matrix, pas une page HTML : le client la parse et en
            # tire un code qui ne se résout pas par l'attente (règle 2).
            return 413 '{"errcode":"M_TOO_LARGE","error":"Fichier au-dessus du plafond de televersement du serveur"}';
        }

        # API d'admin de join forcé jamais exposée : un admin ne doit pas
        # pouvoir s'ajouter à un DM et recevoir les clés Megolm suivantes.
        location ^~ /_synapse/admin/ {
            return 404;
        }

        # Endpoints de module et de client servis par Synapse hors `/_matrix`. Ce
        # préfixe portait le callback OIDC jusqu'à D-12 ; il reste routé pour ce que les
        # modules exposeront. Disjoint du bloc admin ci-dessus, qui reste prioritaire (`^~`).
        location /_synapse/client/ {
            # `set` + variable, comme les cinq autres amonts : sans variable, nginx résout
            # le nom **une seule fois au démarrage** et garde l'IP pour toujours. Synapse
            # recréé après le proxy (un `up -d`, un `restart`) prend une autre IP dans le
            # réseau compose, et toute l'API répond alors 502 — définitivement, sans que
            # rien ne dise pourquoi. La variable force la résolution à chaque requête,
            # via le `resolver` déclaré plus haut.
            set $synapse_upstream synapse:8008;
            proxy_pass http://$synapse_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # — découverte MatrixRTC. Le corps dépend du déploiement,
        # pas du proxy : `proxy/well-known.conf` sans SFU, `rtc/well-known.conf` avec.
        # L'overlay compose monte le second au même chemin et remplace le premier.
        include /etc/nginx/well-known.conf;

        # D-12 — **le changement de mot de passe standard est fermé, et c'est ce qui rend
        # le garde réel.** `POST /_matrix/client/v3/account/password` accepte une UIA
        # `m.login.password` : n'importe quel client Matrix pourrait donc changer le mot de
        # passe avec le seul mot de passe courant, sans la clé de récupération. Et Synapse
        # ne sait pas séparer les deux — `password_enabled_for_login` et
        # `password_enabled_for_reauth` dérivent du même réglage (vérifié en v1.155.0).
        #
        # Le seul chemin restant est `/_synapse/client/tacita/password`, servi par
        # `infra/synapse/modules/tacita_password.py`, qui exige la clé.
        #
        # `^~` et non un préfixe simple : sans lui, `location /_matrix` — plus court mais
        # de même nature — resterait candidat et l'ordre du fichier ne trancherait rien.
        # Retirer ce bloc rouvre le contournement **en silence** : rien ne casse, le garde
        # cesse simplement d'en être un. `infra/tests/mot-de-passe.test.ts` le relit.
        location ^~ /_matrix/client/v3/account/password {
            return 403;
        }
        location ^~ /_matrix/client/r0/account/password {
            return 403;
        }

        # **Le proxy doit être plus patient que le client, pas moins.** `/sync` est du
        # long-polling (interdit n°10 : ce n'est pas du WebSocket), et matrix-js-sdk 42
        # s'accorde `pollTimeout` + `BUFFER_PERIOD_MS`, soit 110 s, avant d'abandonner
        # lui-même. Le défaut de nginx est 60 s : mesuré au banc le 29/08/2026, un Synapse
        # qui répond en 90 s se solde par un 504 à 60,1 s — le proxy renonce cinquante
        # secondes avant celui qui attend.
        #
        # En régime établi Synapse répond en 30 s et rien ne mord. Ça mord là où c'est le
        # plus coûteux : juste après un redémarrage, caches froids et sync initial, quand
        # le client boucle sur un premier `/sync` qui n'aboutit jamais.
        #
        # 120 s, donc au-dessus des 110 s du client : c'est à lui de décider qu'il
        # renonce, pas à l'intermédiaire. `infra/tests/proxy.test.ts` relit les deux
        # constantes dans le SDK épinglé et refuse que cet écart se referme.
        location /_matrix {
            set $synapse_upstream synapse:8008; # voir /_synapse/client/ : résolution par requête
            proxy_read_timeout 120s;
            proxy_pass http://$synapse_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # surface publique de la passerelle push, en deux routes exactes : la clé
        # publique VAPID, dont le client a besoin pour s'abonner, et la présence
        # (ci-dessous). L'endpoint de
        # notification reste interne, il n'a aucune authentification — l'exposer ferait
        # de la passerelle un relais de push ouvert. `=` et non un préfixe : rien
        # d'autre de la passerelle ne doit sortir.
        location = /push/config {
            set $push_gateway_upstream push-gateway:8008;
            proxy_pass http://$push_gateway_upstream/config;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # la page signale qu'elle est à l'écran, et la passerelle ne lui pousse rien
        # pendant ce temps : iOS affiche toute notification, app ouverte comprise, et
        # interdit au service worker de s'en abstenir. Elle ne peut que **taire** les
        # pushes d'un abonnement dont on connaît l'URL secrète, jamais en émettre.
        location = /push/presence {
            set $push_gateway_upstream push-gateway:8008;
            proxy_pass http://$push_gateway_upstream/presence;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # service de liens d'invitation. Le préfixe est retiré par le
        # `rewrite`, **et pas par une partie d'URI sur le proxy_pass**.
        #
        # Mesuré contre nginx 1.27-alpine le 29/08/2026 : quand `proxy_pass` porte à la
        # fois une **variable** et une partie d'URI, nginx ne fait aucune substitution —
        # il envoie l'URI littérale du directive et **jette le reste**. `proxy_pass
        # http://$amont/;` faisait donc arriver `/` à la place de `/links`, et les quatre
        # routes du service répondaient 404 à tout. Sans la variable, la substitution a
        # bien lieu (éprouvé dans les deux sens) — mais la variable est ce qui force la
        # re-résolution DNS à chaque requête, cf. `/_synapse/client/`.
        #
        # `rewrite … break` + `proxy_pass` **sans** partie d'URI est la seule forme qui
        # tienne les deux à la fois, et c'est celle que la doc d'amont prescrit dès qu'une
        # variable entre dans `proxy_pass`.
        #
        # Contrairement à la passerelle push, tout le service est public : ses quatre
        # routes exigent chacune un jeton d'accès Matrix valide, et la limitation de
        # débit de vit dans le service, où elle peut compter par compte.
        location /invite/ {
            set $invite_tokens_upstream invite-tokens:8009;
            rewrite ^/invite/?(.*)$ /$1 break;
            proxy_pass http://$invite_tokens_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # Backend provisionné par `infra/rtc` (lk-jwt-service) : route déclarée ici
        # 502 tant que le service n'est pas déployé.
        # Le préfixe est retiré ici aussi, et pour une autre raison que `/invite/` : sans
        # partie d'URI, nginx passe l'URI **entière**. `lk-jwt-service` sert `/sfu/get`,
        # et recevait `/livekit/jwt/sfu/get` — 404 sur chaque demande de jeton, donc
        # aucun appel possible. Le chemin est imposé par `livekit_service_url` du
        # `.well-known`, auquel MatrixRTC ajoute `/sfu/get`.
        location /livekit/jwt {
            set $livekit_jwt_upstream lk-jwt-service:8080;
            rewrite ^/livekit/jwt/?(.*)$ /$1 break;
            proxy_pass http://$livekit_jwt_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend provisionné par `infra/rtc` (SFU LiveKit), upgrade WebSocket requis.
        # Même retrait, même motif : le SFU sert `/rtc` et `/rtc/validate`, et recevait
        # `/livekit/sfu/rtc…`. La négociation WebSocket échouait donc en 404 après que le
        # jeton, lui, ait déjà échoué en 404 — deux 404 pour un seul appel.
        location /livekit/sfu {
            set $livekit_sfu_upstream livekit-sfu:7880;
            rewrite ^/livekit/sfu/?(.*)$ /$1 break;
            proxy_pass http://$livekit_sfu_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # le shard, servi **sur le domaine du homeserver**, en
        # dernier parce que `/` est le préfixe le plus court : tous les blocs ci-dessus
        # gagnent contre lui.
        #
        # Ce bloc n'existait pas, et son absence était un choix : le shard vivait sur une
        # origine à part (`SHARD_ORIGIN`), déclarée à Synapse une par une, et un décalage
        # d'un caractère bloquait tout retour de connexion sans qu'aucun log ne le nomme.
        # Même origine, plus rien à tenir en phase — et depuis D-12 il n'y a plus de retour
        # de connexion du tout, l'identité étant portée par Synapse lui-même.
        #
        # Et surtout : c'est ce qui rend le contexte sécurisé gratuit. Sur
        # une origine en clair, `crypto.subtle` n'existe pas, le service worker ne
        # s'installe pas, et la clé de récupération ne peut pas être créée.
        #
        # Le backend n'existe que là où le shard est déployé (overlay `staging/`) : dans
        # la pile de base, `/` répond 502, comme les routes `/livekit/*` sans `infra/rtc`.
        location / {
            # `set` + variable : voir /_matrix. Sans elle, nginx exige que `web` résolve
            # **au démarrage** et refuse de démarrer du tout quand le service est absent.
            set $web_upstream web:3000;
            proxy_pass http://$web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Element Call, servi sous son propre nom d'hôte quand l'overlay RTC
    # est monté. Inclus au niveau `http` et non dans le bloc ci-dessus : c'est un bloc
    # `server` entier, l'image d'Element Call servant son SPA à la racine d'une origine.
    # Vide dans la pile de base — voir `proxy/call.conf`.
    include /etc/nginx/call.conf;
}
